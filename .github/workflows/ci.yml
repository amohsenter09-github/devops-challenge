name: CI

# Run on pushes to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # contents: read = clone the repo; packages: write = push the image to GHCR.
    permissions:
      contents: read
      packages: write
    env:
      # Image name in GitHub Container Registry: ghcr.io/<owner>/<repo>
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      # Fetch the repository (pom.xml, Dockerfile, source).
      - uses: actions/checkout@v7

      # Install JDK 21 and cache Maven dependencies.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Run unit tests here; the Dockerfile skips tests with -DskipTests.
      - name: Test
        run: mvn -B test

      # Build the Docker image. No tag means Docker uses :latest.
      - name: Build image
        run: docker build -t "$IMAGE" .

      # Start the container and confirm it runs (prints Hello World).
      - name: Run image
        run: docker run --rm "$IMAGE"

      # Log in to GHCR and push. Only on main, not on pull requests.
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
