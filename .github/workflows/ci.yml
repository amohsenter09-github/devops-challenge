name: CI

# This branch only. main keeps publishing :latest and is left unchanged.
on:
  push:
    branches: [scenario-v1]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Do not use :latest on this branch (that tag is the main CLI image).
  TAG: scenario-v1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        run: mvn -B test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Web app stays up; smoke-test GET / then remove the container.
      - name: Build
        run: |
          docker build -t "$IMAGE:$TAG" .
          docker run -d --name ci-app -p 8080:8080 "$IMAGE:$TAG"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/ | grep -q "Hello World"; then
              docker rm -f ci-app
              exit 0
            fi
            sleep 1
          done
          docker logs ci-app
          docker rm -f ci-app
          exit 1

      - name: Save image
        run: docker save "$IMAGE:$TAG" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz

  push:
    name: Push
    needs: build
    if: github.ref == 'refs/heads/scenario-v1' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
