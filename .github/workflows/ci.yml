name: CI

# Run on pushes to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

env:
  # Image name in GitHub Container Registry: ghcr.io/<owner>/<repo>
  IMAGE: ghcr.io/${{ github.repository }}
  # github.run_number increases by 1 on every CI run (1, 2, 3, ...).
  TAG: ${{ github.run_number }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Fetch the repository (pom.xml and tests).
      - uses: actions/checkout@v7

      # Install JDK 21 and cache Maven dependencies.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Run unit tests here; the Dockerfile skips tests with -DskipTests.
      - name: Test
        run: mvn -B test

  build:
    name: Build
    # Wait until tests pass.
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Jobs do not share a disk; check the code out again for docker build.
      - uses: actions/checkout@v7

      # Build once, tag as :latest and as the sequence number (:1, :2, :3, ...).
      - name: Build
        run: |
          docker build -t "$IMAGE:latest" -t "$IMAGE:$TAG" .
          docker run --rm "$IMAGE:latest"

      # Save both tags so the Push job can publish the same build (no rebuild).
      - name: Save image
        run: docker save "$IMAGE:latest" "$IMAGE:$TAG" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz

  push:
    name: Push
    # Wait until the image has been built and saved.
    needs: build
    # Publish only from main, not from pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Load the image produced by the Build job.
      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      # Log in to GHCR and push both :latest and the sequence tag.
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
